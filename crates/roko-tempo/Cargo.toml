[package]
name = "roko-tempo"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Light-client trait + Tempo-shaped impl for Roko agents that consume external chain state with cryptographic verification."

[lints]
workspace = true

[features]
default = []
# Phase 1 (not yet wired): real commonware-p2p subscription to a Tempo
# follower-node. Pulls in commonware-* crates. Off by default; the mock
# backend ships in the default build so tests/demos run with no network.
commonware-backend = []

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
parking_lot = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "test-util"] }
anyhow = { workspace = true }

[[example]]
name = "tempo_tail"
path = "examples/tempo_tail.rs"
