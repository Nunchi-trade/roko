# Roko project config — routes through the bardo gateway

[server]
port = 6677

[agent]
command = "claude"
args = ["--print", "--output-format", "stream-json", "--dangerously-skip-permissions"]
model = "claude-sonnet-4-6"
effort = "high"
bare_mode = true
fallback_model = "claude-haiku-4-5"
timeout_ms = 300000
env = [
  ["ANTHROPIC_BASE_URL", "http://127.0.0.1:4000"],
  ["ANTHROPIC_API_KEY", "mori-local-gateway"],
]

[providers.claude_cli]
kind = "claude_cli"
command = "claude"

[models.claude-sonnet-4-6]
provider = "claude_cli"
slug = "claude-sonnet-4-6"

# Per-tier model mapping (matches mori's band→model system)
# Overrides the global model when tasks.toml specifies a tier.
# mechanical = cheapest model for imports/renames (≤20 LOC)
# focused = mid-tier for single functions/tests (≤50 LOC)
# integrative = mid/high for multi-module wiring (≤150 LOC)
# architectural = highest for API design (≤300 LOC)
[agent.tier_models]
mechanical = "claude-haiku-4-5"
focused = "claude-sonnet-4-6"
integrative = "claude-sonnet-4-6"
architectural = "claude-opus-4-6"

# Per-role runtime overrides.
# [agent.roles.implementer]
# role = "code_implementer"
# model = "claude-opus-4-6"
# tools = ["read_file", "edit_file", "git-*"]
# budget = { max_tokens_per_turn = 12000, max_cost_usd_cents_per_turn = 500 }
# thresholds = { gate_pass_rate_floor = 0.70 }
# routing_overrides = { force_backend = "claude", force_tier = "focused" }
# legacy: turn_budget_usd = 5.0

# Retry escalation: on failure, escalate to next tier's model
# mechanical → focused → integrative → architectural → human
[agent.escalation]
max_retries = 3
escalate_model = true

[prompt]
token_budget = 50000
role = "You are a Roko agent working on the roko codebase at /Users/will/dev/nunchi/roko/roko/."

# Per-role prompt budgets (chars, matching mori's PromptBudget)
[prompt.budgets.implementer]
plan = 50000
prd = 12000
brief = 8000
file_context = 20000
skills = 4000

[prompt.budgets.reviewer]
plan = 30000
prd = 8000
brief = 6000
file_context = 8000
skills = 2000

[prompt.budgets.architect]
plan = 50000
prd = 15000
brief = 8000
file_context = 25000
skills = 4000

# Cost budgets
[budget]
max_plan_usd = 10.0
max_task_usd = 1.0
warn_at_percent = 80

[[gate]]
kind = "compile"

[[gate]]
kind = "test"

[scheduler]

[[scheduler.cron]]
name = "weekly-digest"
expression = "0 9 * * MON"
signal_kind = "scheduler:cron:weekly-digest"

[watcher]

[[watcher.paths]]
name = "call-notes"
directory = "call-notes/"
include = ["*.md", "*.txt"]
exclude = ["*.tmp", ".DS_Store"]
signal_kind = "fswatcher:created"  # only emit on creation, not modification
recursive = true
debounce_ms = 500

[[agents]]
name = "nunchi-intelligence"
domain = "general"
prompt = "You are the Nunchi Intelligence agent, grounded in the roko codebase at /Users/will/dev/nunchi/roko/roko/. You help with research, implementation, and codebase questions."
enabled = true

[deploy]
backend = "railway-api"
worker_image = "ghcr.io/nunchi-trade/roko-worker:latest"

[webhooks.github]
secret = "unused"
enabled = false
