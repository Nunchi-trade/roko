# Project-specific config for the roko repo.
# Global settings (agent, tools, prompt, providers, models, budget, serve)
# live in ~/.roko/config.toml. Secrets in ~/.roko/.env.

auto_plan = false

[dreams]
auto_dream = true
idle_threshold_mins = 15
min_episodes_for_dream = 5

[daimon.strategy_space]
domain = "coding"
dimensions = [
    "complexity",
    "risk",
    "novelty",
    "confidence",
    "time_pressure",
    "scope",
    "reversibility",
    "dependency_depth",
]

[[gate]]
kind = "shell"
program = "true"
args = []
timeout_ms = 60000

[executor]
max_concurrent_plans = 4
max_concurrent_tasks = 8
max_auto_fix_iterations = 5
max_merge_attempts = 3
task_timeout_secs = 600
speculative_threshold_multiplier = 2.0
auto_replan = false
use_worktrees = false

[executor.resource_budget]
max_concurrent = 8

[prd]
auto_plan = false

[chain]
rpc_url = "http://127.0.0.1:8545"
chain_id = 31337
wallet_key = "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
agent_registry = "0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0"
bounty_market = "0xDc64a140Aa3E981100a9becA4E685f962f0cF6C9"
