# REQUIRED_ENV
# Required environment variables (set in .env or shell):
# GITHUB_TOKEN       — GitHub personal access token (for MCP GitHub server)
# GITHUB_WEBHOOK_SECRET — GitHub webhook secret for deploy registration
# SLACK_BOT_TOKEN    — Slack bot token (for MCP Slack server)
# SLACK_SIGNING_SECRET — Slack webhook signing secret
ANTHROPIC_API_KEY='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'

auto_plan = false

[agent]
command = "claude"
args = []
effort = "medium"
bare_mode = true
timeout_ms = 120000
env = []
clean_output = true

[agent.tier_models]
fast = "ollama/llama3.2:latest"
standard = "ollama/gemma4:26b-a4b-it-q8_0"

[agent.escalation]
max_retries = 3
escalate_model = true

[dreams]
auto_dream = true
idle_threshold_mins = 15
min_episodes_for_dream = 5

[daimon.strategy_space]
domain = "coding"
dimensions = [
    "complexity",
    "risk",
    "novelty",
    "confidence",
    "time_pressure",
    "scope",
    "reversibility",
    "dependency_depth",
]

[tools]
prefer_mcp = false
global_denied = []
mcp_timeout_secs = 30

[prompt]
token_budget = 10000
role = "implementer"
files = []

[prompt.budgets]

[prompt.context_budgets]
surgical = 4000
focused = 12000
full = 24000

[[gate]]
kind = "shell"
program = "true"
args = []
timeout_ms = 60000

[executor]
max_concurrent_plans = 4
max_concurrent_tasks = 8
max_auto_fix_iterations = 5
max_merge_attempts = 3
task_timeout_secs = 600
speculative_threshold_multiplier = 2.0
auto_replan = false
use_worktrees = false

[executor.resource_budget]
max_concurrent = 8

[budget]
max_plan_usd = 10.0
max_task_usd = 1.0
max_session_usd = 50.0
warn_at_percent = 80

[serve]
auto_orchestrate = true

[serve.auth]
enabled = false
api_key = ""

[serve.deploy]
provider = "railway"
environment = [
    "GITHUB_TOKEN",
    "GITHUB_WEBHOOK_SECRET",
    "SLACK_BOT_TOKEN",
    "SLACK_SIGNING_SECRET",
]

[providers.ollama]
kind = "openai_compat"
base_url = "http://localhost:11434/v1"
timeout_ms = 180000

[models.llama32]
provider = "ollama"
slug = "llama3.2:latest"
context_window = 8192
supports_tools = true
tool_format = "openai_json"

[models.gemma4]
provider = "ollama"
slug = "gemma4:26b-a4b-it-q8_0"
context_window = 8192
supports_tools = true
tool_format = "openai_json"

# PRD settings (parsed by `RokoConfig`)
