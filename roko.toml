config_version = 1
schema_version = 2

[project]
name = "roko-project"
root = "."
fresh_base_branch = "main"

[prd]
auto_plan = false

[agent]
command = "claude"
default_model = "glm-5.1"
default_backend = "zhipu"
default_effort = "medium"
temperament = "balanced"
context_limit_k = 200
bare_mode = true
mode = "ephemeral"

[agent.roles]

[providers.anthropic]
kind = "claude_cli"
command = "claude"
default_model = "claude-sonnet-4-6"
models = ["claude-haiku-4-5", "claude-sonnet-4-6", "claude-opus-4-6"]

[providers.openai]
kind = "openai_compat"
api_key_env = "OPENAI_API_KEY"
base_url = "https://api.openai.com/v1"
default_model = "gpt-4.1"
models = ["gpt-4.1", "gpt-4.1-mini", "gpt-4.1-nano", "o3", "o3-mini", "o4-mini", "codex-mini-latest"]

[providers.perplexity]
kind = "perplexity_api"
api_key_env = "PERPLEXITY_API_KEY"
default_model = "sonar-pro"
models = ["sonar", "sonar-pro", "sonar-reasoning-pro"]

[providers.moonshot]
kind = "openai_compat"
api_key_env = "MOONSHOT_API_KEY"
base_url = "https://api.moonshot.ai/v1"
default_model = "kimi-k2.6"
models = ["kimi-k2.6", "kimi-k2.5", "kimi-k2", "moonshot-v1-auto"]

[providers.zhipu]
kind = "openai_compat"
api_key_env = "ZAI_API_KEY"
base_url = "https://open.bigmodel.cn/api/paas/v4"
default_model = "glm-5.1"
models = ["glm-5.1", "glm-5-turbo", "glm-4.5-flash", "glm-4-plus"]

[providers.gemini]
kind = "openai_compat"
api_key_env = "GEMINI_API_KEY"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
default_model = "gemini-2.5-flash"
models = ["gemini-2.5-flash", "gemini-2.5-pro"]

[providers.cerebras]
kind = "cerebras_api"
api_key_env = "CEREBRAS_API_KEY"
base_url = "https://api.cerebras.ai/v1"
default_model = "llama-3.3-70b"
models = ["llama-3.3-70b", "llama-3.1-8b", "llama-4-scout-17b-16e"]

[providers.ollama]
kind = "openai_compat"
api_key_env = ""
base_url = "http://localhost:11434/v1"
default_model = "llama3.1"
models = ["llama3.1", "codellama", "mistral", "deepseek-coder-v2"]

[models]

# Anthropic
[models.haiku]
provider = "anthropic"
slug = "claude-haiku-4-5"

[models.sonnet]
provider = "anthropic"
slug = "claude-sonnet-4-6"

[models.opus]
provider = "anthropic"
slug = "claude-opus-4-6"

# OpenAI
[models.gpt41]
provider = "openai"
slug = "gpt-4.1"

[models.gpt41-mini]
provider = "openai"
slug = "gpt-4.1-mini"

[models.gpt41-nano]
provider = "openai"
slug = "gpt-4.1-nano"

[models.o3]
provider = "openai"
slug = "o3"

[models.o3-mini]
provider = "openai"
slug = "o3-mini"

[models.o4-mini]
provider = "openai"
slug = "o4-mini"

[models.codex-mini]
provider = "openai"
slug = "codex-mini-latest"

# Perplexity
[models.sonar]
provider = "perplexity"
slug = "sonar-pro"

[models.sonar-reasoning]
provider = "perplexity"
slug = "sonar-reasoning-pro"

# Moonshot / Kimi
[models.kimi-k26]
provider = "moonshot"
slug = "kimi-k2.6"

[models.kimi-k25]
provider = "moonshot"
slug = "kimi-k2.5"

[models.kimi-k2]
provider = "moonshot"
slug = "kimi-k2"

# Zhipu / GLM
[models.glm51]
provider = "zhipu"
slug = "glm-5.1"

[models.glm5-turbo]
provider = "zhipu"
slug = "glm-5-turbo"

[models.glm45-flash]
provider = "zhipu"
slug = "glm-4.5-flash"

[models.glm4]
provider = "zhipu"
slug = "glm-4-plus"

# Cerebras
[models.cerebras-70b]
provider = "cerebras"
slug = "llama-3.3-70b"

[models.cerebras-8b]
provider = "cerebras"
slug = "llama-3.1-8b"

[models.cerebras-scout]
provider = "cerebras"
slug = "llama-4-scout-17b-16e"

# Gemini
[models.gemini-flash]
provider = "gemini"
slug = "gemini-2.5-flash"

[models.gemini-pro]
provider = "gemini"
slug = "gemini-2.5-pro"

[gates]
clippy_enabled = true
skip_tests = false
max_iterations = 3

[routing]
mode = "auto_override"
algorithm = "linucb"
discount_factor = 0.99
fast_task_model = "claude-haiku-4-5"
standard_task_model = "claude-sonnet-4-6"
complex_task_model = "claude-opus-4-6"
context_strategy = "mcp_first"

[routing.weights]
quality = 0.5
cost = 0.3
latency = 0.2

[pipeline.mechanical]
strategist = false
reviewers = false
reviewer_mode = "quick"
max_iterations = 1

[pipeline.focused]
strategist = false
reviewers = false
reviewer_mode = "quick"
max_iterations = 2

[pipeline.integrative]
strategist = true
reviewers = true
reviewer_mode = "quick"
max_iterations = 2

[pipeline.architectural]
strategist = true
reviewers = true
reviewer_mode = "full"
max_iterations = 3

[budget]
max_plan_usd = 25.0
max_turn_usd = 3.0
prompt_token_budget = 10000

[conductor]
max_agents = 8
max_parallel_plans = 1
parallel_enabled = false
express_mode = false
auto_advance_batch = true
auto_merge_on_complete = false
pre_plan = false
max_auto_fix_attempts = 3
auto_fix_model = "claude-haiku-4-5"
warm_implementers_per_plan = 1

[conductor.enabled_roles]
architect = true
auditor = true
scribe = true
critic = true

[learning]
auto_playbook_refresh = true
knowledge_file_intel = true
knowledge_warnings = true
knowledge_wave_context = true
knowledge_error_patterns = true
learning_min_occurrences = 2
file_intel_max_entries = 15
warning_max_entries = 5
replan_on_gate_failure = true
replan_max_per_plan = 2
replan_gate_attempts = 3
use_lookahead_router = false
lookahead_threshold = 0.7

[demurrage]
rate_per_hour = 0.01
min_balance = 0.1
freeze_threshold = 0.05
thaw_balance = 0.6
max_balance = 5.0
gc_interval_secs = 0
freeze_before_delete = true
death_threshold = 0.01

[demurrage.kind_rate_multipliers]

[attention]
max_tokens_per_layer = 4096
utilization_target = 0.85
auction_enabled = false
task_reserve_tokens = 512

[immune]
quarantine_threshold = 0.8
max_quarantined = 50
auto_reject = false
taint_levels = [
    "low",
    "medium",
    "high",
]

[temporal]
max_depth = 5
epoch_secs = 3600
enforce_allen_relations = true

[goals]
max_active = 10
correctness_weight = 0.7
completion_threshold = 0.95
prune_threshold = 0.1

[energy]
pool_usd = 50.0
per_task_cap_usd = 0.0
metabolism_rate = 0.1

[energy.tier_caps]

[tui]
refresh_rate_ms = 250

[serve]
auto_orchestrate = true

[serve.auth]
enabled = false
api_key = ""

[serve.deploy]
provider = "railway"
environment = [
    "GITHUB_TOKEN",
    "GITHUB_WEBHOOK_SECRET",
    "SLACK_BOT_TOKEN",
    "SLACK_SIGNING_SECRET",
]

[scheduler]

[webhooks.github]
secret = ""

[server]
bind = "127.0.0.1"
port = 6677
cors_origins = []

[deploy]
backend = "manual"
worker_image = "ghcr.io/nunchi-trade/roko-worker:latest"

[perplexity]
search_recency_filter = "year"
academic_mode = false
search_domain_filter = []
return_images = false
return_related_questions = true

[gemini]
use_free_tier = false
thinking_level = "medium"
enable_context_caching = false
safety_settings = []

[tools]
allow = []
deny = []

[tools.profiles]

[oneirography]
enabled = false
provider = "disabled"
variants = 3
base_reserve = 0.01
base_duration_seconds = 3600

[chain]
rpc_url = "http://127.0.0.1:8545"
chain_id = 31337
wallet_key = "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
agent_registry = "0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0"
bounty_market = "0xDc64a140Aa3E981100a9becA4E685f962f0cF6C9"

[relay]
heartbeat_interval_secs = 30
