[package]
name = "roko-jobs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Perpetual Agent Jobs runtime — JobRegistry, 4 engines, EventSubscriber, heartbeat, StatusTracker. Ports offchainservices-agent's cli/jobs/ and contracts-core/docs/agent_cli_jobs_spec.tex. See plans/P08-trading-surface.md."

[lints]
workspace = true

[dependencies]
roko-core = { path = "../roko-core" }
roko-runtime = { path = "../roko-runtime" }
roko-chain = { path = "../roko-chain" }
roko-venue = { path = "../roko-venue" }
roko-custody = { path = "../roko-custody" }
async-trait = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile = { workspace = true }
